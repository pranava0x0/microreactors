name: ci

# Security posture: this workflow interpolates no event-controlled input
# (no github.event.* anywhere) and runs with read-only repo permissions.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # The whole gate, stdlib only: data integrity + citation coverage,
      # generator sync/idempotency, and the HTML/CSS/JS contract.
      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

      # Belt and braces: regenerating every derived artifact must be a no-op.
      # (The suite asserts this too; this step makes the diff visible in the
      # log when it fails.)
      - name: Derived artifacts are committed in sync
        run: |
          python3 tools/build_gaps.py
          python3 tools/build_data.py
          python3 tools/build_meta.py
          git diff --exit-code
