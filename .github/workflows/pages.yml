name: pages

# Deploys site/ to GitHub Pages. No build step exists by design: site/data.js
# is committed, and the ci workflow proves it is in sync with data/*.json.
#
# Security posture: no github.event.* input is interpolated anywhere in this
# workflow; the single expression used is a trusted step output
# (steps.deployment.outputs.page_url), per the official deploy-pages pattern.
permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # Refuse to publish a site whose data or contract is broken.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Gate on the test suite
        run: python3 -m unittest discover -s tests

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
